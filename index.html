<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="icon" href="/proto-actions-pane/favicon.ico"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#000000"/><meta name="description" content="Actions Pane V4 Redesign Prototype"/><link rel="apple-touch-icon" href="/proto-actions-pane/logo192.png"/><link rel="manifest" href="/proto-actions-pane/manifest.json"/><title>Actions Pane V4</title><script defer="defer" src="/proto-actions-pane/static/js/main.f4e8c9c4.js"></script><link href="/proto-actions-pane/static/css/main.6e1893aa.css" rel="stylesheet"></head><body>
<style>
#password-gate{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;position:fixed;top:0;left:0;background:#1a1a1a;z-index:10000;font-family:'Segoe UI Variable','Segoe UI',-apple-system,sans-serif}
#pw-form{text-align:center}
#pw-form h2{color:#fff;margin-bottom:16px;font-weight:400;font-size:1.25rem}
#pw-form input{padding:10px 16px;font-size:1rem;border:1px solid #444;border-radius:6px;background:#2a2a2a;color:#fff;outline:none;width:240px}
#pw-form input:focus{border-color:#464FEB}
#pw-form button{margin-left:8px;padding:10px 20px;font-size:1rem;border:none;border-radius:6px;background:#464FEB;color:#fff;cursor:pointer}
#pw-form button:hover{background:#3b43d1}
#pw-error{color:#f5576c;margin-top:12px;display:none;font-size:0.9rem}
#root.locked{display:none}
</style>
<div id="password-gate"><form id="pw-form" onsubmit="return false;"><h2>Enter password to continue</h2><input id="pw-input" type="password" placeholder="Password" autofocus /><button type="submit">Go</button><p id="pw-error">Incorrect password</p></form></div>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root" class="locked"></div>
<script>
/* Password gate — change the value below to update the password */
(function(){
  var SITE_PASSWORD="matwenger";
  var gate=document.getElementById("password-gate");
  var root=document.getElementById("root");
  var err=document.getElementById("pw-error");
  if(sessionStorage.getItem("authenticated")==="true"){gate.style.display="none";root.classList.remove("locked");return;}
  document.getElementById("pw-form").addEventListener("submit",function(){
    if(document.getElementById("pw-input").value===SITE_PASSWORD){
      sessionStorage.setItem("authenticated","true");gate.style.display="none";root.classList.remove("locked");
    }else{err.style.display="block";document.getElementById("pw-input").value="";}
  });
})();
</script>
</body></html>
